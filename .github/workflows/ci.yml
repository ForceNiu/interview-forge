name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # lint（代码检查）闸门：拦截 any 滥用、未用变量、CJS require、effect 里 setState 等问题。
  # 放在最前是因为它最便宜——风格不过就没必要跑后面三道。规则见 eslint.config.mjs。
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

  type-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type check
        run: npm run type-check

  # 单元测试（unit test）质量闸门：每次 push / PR 自动跑 npm test
  # 当前 QuestionForm 测试用 jsdom 假浏览器 + mock（造假），不依赖真实数据库，无需 DATABASE_URL
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run tests
        run: npm test

  # build job：provider 为 postgresql，build 时需连库预渲染部分页面，
  # 需要仓库配置 GitHub Secret `DATABASE_URL`（独立 Neon 库连接串）。
  # 未配该 Secret 时此 job 会失败——属预期，不是代码问题。
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
