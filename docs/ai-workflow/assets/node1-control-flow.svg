<svg viewBox="0 0 680 740" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#B4B2A9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <title>节点① 分析简历控制流</title>
  <desc>analyzeResume：拼 prompt 调 LLM 抽 JSON，经 Zod 校验 + domainDepth 一致性（纯函数）后输出 analysis；任一环节失败即由手写 for 循环重试整个节点（lastErr 回灌，非框架，≤3 次）</desc>

  <g>
    <rect x="200" y="40" width="280" height="44" rx="8" fill="#2C2C2A" stroke="#7F77DD" stroke-width="0.5"/>
    <text x="340" y="58" text-anchor="middle" fill="#F1EFE8" font-size="14" font-weight="500" dominant-baseline="central">节点① 入口</text>
    <text x="340" y="76" text-anchor="middle" fill="#B4B2A9" font-size="12" dominant-baseline="central">输入 resume（+jd 可选）</text>
  </g>
  <line x1="340" y1="84" x2="340" y2="106" stroke="#B4B2A9" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="180" y="106" width="320" height="58" rx="8" fill="#2C2C2A" stroke="#7F77DD" stroke-width="0.5"/>
    <text x="340" y="126" text-anchor="middle" fill="#F1EFE8" font-size="13" font-weight="500" dominant-baseline="central">拼 prompt</text>
    <text x="340" y="146" text-anchor="middle" fill="#B4B2A9" font-size="12" dominant-baseline="central">10 知识域分类 + domainDepth 互恰规则</text>
    <text x="340" y="162" text-anchor="middle" fill="#B4B2A9" font-size="11" dominant-baseline="central">只列真实技能、不编造</text>
  </g>
  <line x1="340" y1="164" x2="340" y2="186" stroke="#B4B2A9" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="200" y="186" width="280" height="44" rx="8" fill="#2C2C2A" stroke="#7F77DD" stroke-width="0.5"/>
    <text x="340" y="208" text-anchor="middle" fill="#F1EFE8" font-size="13" font-weight="500" dominant-baseline="central">llm.invoke 调 LLM（大语言模型）</text>
  </g>
  <line x1="340" y1="230" x2="340" y2="254" stroke="#B4B2A9" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="200" y="254" width="280" height="44" rx="8" fill="#2C2C2A" stroke="#7F77DD" stroke-width="0.5"/>
    <text x="340" y="276" text-anchor="middle" fill="#F1EFE8" font-size="13" font-weight="500" dominant-baseline="central">正则抽取 JSON `{...}`</text>
  </g>
  <line x1="340" y1="298" x2="340" y2="316" stroke="#B4B2A9" stroke-width="1.5" marker-end="url(#arrow)"/>

  <polygon points="340,316 420,356 340,396 260,356" fill="#2C2C2A" stroke="#7F77DD" stroke-width="0.5"/>
  <text x="340" y="352" text-anchor="middle" fill="#F1EFE8" font-size="12" font-weight="500" dominant-baseline="central">抽到合法 JSON?</text>
  <text x="200" y="350" fill="#B4B2A9" font-size="11">否</text>
  <text x="430" y="350" fill="#B4B2A9" font-size="11">是</text>
  <line x1="260" y1="356" x2="480" y2="340" stroke="#BA7517" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="340" y1="396" x2="340" y2="420" stroke="#B4B2A9" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="200" y="420" width="280" height="64" rx="8" fill="#2C2C2A" stroke="#7F77DD" stroke-width="0.5"/>
    <text x="340" y="440" text-anchor="middle" fill="#F1EFE8" font-size="13" font-weight="500" dominant-baseline="central">Zod 校验 + domainDepth 一致性</text>
    <text x="340" y="460" text-anchor="middle" fill="#B4B2A9" font-size="12" dominant-baseline="central">resumeAnalysisSchema.parse</text>
    <text x="340" y="476" text-anchor="middle" fill="#B4B2A9" font-size="11" dominant-baseline="central">一致性校验：纯函数·不调 LLM</text>
  </g>
  <line x1="340" y1="484" x2="340" y2="500" stroke="#B4B2A9" stroke-width="1.5" marker-end="url(#arrow)"/>

  <polygon points="340,500 420,540 340,580 260,540" fill="#2C2C2A" stroke="#7F77DD" stroke-width="0.5"/>
  <text x="340" y="536" text-anchor="middle" fill="#F1EFE8" font-size="12" font-weight="500" dominant-baseline="central">校验通过?</text>
  <text x="200" y="534" fill="#B4B2A9" font-size="11">否</text>
  <text x="430" y="534" fill="#B4B2A9" font-size="11">是</text>
  <line x1="260" y1="540" x2="480" y2="430" stroke="#BA7517" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="340" y1="580" x2="340" y2="602" stroke="#B4B2A9" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="200" y="602" width="280" height="56" rx="8" fill="#2C2C2A" stroke="#7F77DD" stroke-width="0.5"/>
    <text x="340" y="622" text-anchor="middle" fill="#F1EFE8" font-size="13" font-weight="500" dominant-baseline="central">输出 analysis</text>
    <text x="340" y="640" text-anchor="middle" fill="#B4B2A9" font-size="12" dominant-baseline="central">含 domainDepth / 技能域 / 水平 / 亮点 / 盲区</text>
    <text x="340" y="654" text-anchor="middle" fill="#B4B2A9" font-size="11" dominant-baseline="central">+ logs → 交节点②</text>
  </g>

  <g>
    <rect x="480" y="330" width="180" height="120" rx="8" fill="#2C2C2A" stroke="#BA7517" stroke-width="1"/>
    <text x="496" y="352" fill="#FAC775" font-size="13" font-weight="500" dominant-baseline="central">任一环节失败即抛错</text>
    <text x="496" y="376" fill="#F1EFE8" font-size="12" dominant-baseline="central">· JSON 抽不到</text>
    <text x="496" y="396" fill="#F1EFE8" font-size="12" dominant-baseline="central">· Zod 畸形</text>
    <text x="496" y="416" fill="#F1EFE8" font-size="12" dominant-baseline="central">· 一致性不通过</text>
    <text x="496" y="438" fill="#FAC775" font-size="12" dominant-baseline="central">→ 手写 for 循环重试（非框架）</text>
    <text x="496" y="454" fill="#FAC775" font-size="12" dominant-baseline="central">重试节点①（≤3 次）</text>
  </g>
  <line x1="570" y1="330" x2="570" y2="62" stroke="#BA7517" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="570" y1="62" x2="480" y2="62" stroke="#BA7517" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
</svg>
