<svg viewBox="0 0 680 540" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>节点⑤ 质量校验控制流</title>
  <desc>validateQuestions 确定性门禁：对节点④产出的 allQuestions 逐题跑 validateQuestionSemantics（5 规则：难度1-5/内容≥30字/标签非空/含开放式问法/与简历技能相关），按域汇总 issuesByDomain；failedDomains=callFailedDomains∪semanticFailed 且 round+1；shouldRefine 判定（失败域非空 且 round≤2）回环节点④只重失败域，否则 END 输出题目集</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#B4B2A9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- ④ 生成题目（入口，上一步输出） -->
  <g>
    <rect x="240" y="40" width="200" height="52" rx="8" fill="#2C2C2A" stroke="#7F77DD" stroke-width="0.5"/>
    <text x="340" y="58" text-anchor="middle" fill="#F1EFE8" font-size="14" font-weight="500" dominant-baseline="central">④ 生成题目</text>
    <text x="340" y="78" text-anchor="middle" fill="#B4B2A9" font-size="12" dominant-baseline="central">allQuestions = kept + new（节点④输出）</text>
  </g>

  <!-- ⑤ 质量校验 -->
  <g>
    <rect x="240" y="116" width="200" height="72" rx="8" fill="#2C2C2A" stroke="#7F77DD" stroke-width="0.5"/>
    <text x="340" y="136" text-anchor="middle" fill="#F1EFE8" font-size="14" font-weight="500" dominant-baseline="central">⑤ 质量校验（validateQuestions）</text>
    <text x="340" y="158" text-anchor="middle" fill="#B4B2A9" font-size="12" dominant-baseline="central">逐题跑 validateQuestionSemantics</text>
    <text x="340" y="178" text-anchor="middle" fill="#B4B2A9" font-size="12" dominant-baseline="central">5 条硬规则 · 零 LLM · 只打标</text>
  </g>

  <!-- 按域汇总 -->
  <g>
    <rect x="240" y="212" width="200" height="52" rx="8" fill="#2C2C2A" stroke="#7F77DD" stroke-width="0.5"/>
    <text x="340" y="230" text-anchor="middle" fill="#F1EFE8" font-size="14" font-weight="500" dominant-baseline="central">按域汇总 issuesByDomain</text>
    <text x="340" y="250" text-anchor="middle" fill="#B4B2A9" font-size="12" dominant-baseline="central">semanticFailed = 不达标域名</text>
  </g>

  <!-- 计算失败域 -->
  <g>
    <rect x="240" y="288" width="200" height="52" rx="8" fill="#2C2C2A" stroke="#7F77DD" stroke-width="0.5"/>
    <text x="340" y="306" text-anchor="middle" fill="#F1EFE8" font-size="14" font-weight="500" dominant-baseline="central">failedDomains 计算</text>
    <text x="340" y="326" text-anchor="middle" fill="#B4B2A9" font-size="12" dominant-baseline="central">callFailedDomains ∪ semanticFailed · round+1</text>
  </g>

  <!-- shouldRefine 菱形（唯一判定） -->
  <polygon points="250,384 340,354 430,384 340,414" fill="#2C2C2A" stroke="#7F77DD" stroke-width="0.5"/>
  <text x="340" y="378" text-anchor="middle" fill="#F1EFE8" font-size="12" font-weight="500" dominant-baseline="central">shouldRefine?</text>
  <text x="340" y="397" text-anchor="middle" fill="#B4B2A9" font-size="10.5" dominant-baseline="central">失败域非空 且 round≤2</text>

  <!-- END -->
  <g>
    <rect x="240" y="470" width="200" height="52" rx="8" fill="#2C2C2A" stroke="#7F77DD" stroke-width="0.5"/>
    <text x="340" y="488" text-anchor="middle" fill="#F1EFE8" font-size="14" font-weight="500" dominant-baseline="central">出题完成 END</text>
    <text x="340" y="508" text-anchor="middle" fill="#B4B2A9" font-size="12" dominant-baseline="central">输出最终题目集</text>
  </g>

  <!-- 顺序箭头 -->
  <line x1="340" y1="92" x2="340" y2="116" stroke="#B4B2A9" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <line x1="340" y1="188" x2="340" y2="212" stroke="#B4B2A9" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <line x1="340" y1="264" x2="340" y2="288" stroke="#B4B2A9" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <line x1="340" y1="340" x2="340" y2="354" stroke="#B4B2A9" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <line x1="340" y1="414" x2="340" y2="470" stroke="#B4B2A9" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- 回环（是）：shouldRefine → ④ 只重失败域 -->
  <path d="M430,384 H665 V66 H440" fill="none" stroke="#BA7517" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="455" y="376" fill="#FAC775" font-size="11.5" dominant-baseline="central">是 → 回环节点④（只重失败域）</text>

  <!-- 否 标注 -->
  <text x="352" y="454" fill="#B4B2A9" font-size="10.5" dominant-baseline="central">否：无失败域 或 round&gt;2</text>

  <!-- 侧栏：逐题语义校验 5 规则（确定性机制，对齐 node1 重试侧栏） -->
  <g>
    <rect x="455" y="116" width="185" height="210" rx="8" fill="#2C2C2A" stroke="#BA7517" stroke-width="1"/>
    <text x="471" y="140" fill="#FAC775" font-size="13" font-weight="500" dominant-baseline="central">逐题语义校验 5 规则</text>
    <text x="471" y="166" fill="#F1EFE8" font-size="12" dominant-baseline="central">· 难度 1-5</text>
    <text x="471" y="190" fill="#F1EFE8" font-size="12" dominant-baseline="central">· 内容 ≥30 字</text>
    <text x="471" y="214" fill="#F1EFE8" font-size="12" dominant-baseline="central">· 标签非空（多对多）</text>
    <text x="471" y="238" fill="#F1EFE8" font-size="12" dominant-baseline="central">· 含开放式问法</text>
    <text x="471" y="262" fill="#F1EFE8" font-size="12" dominant-baseline="central">· 与简历/技能相关</text>
    <text x="471" y="290" fill="#F1EFE8" font-size="11" dominant-baseline="central">确定性可判定 · 不靠 LLM 评分</text>
  </g>
</svg>
