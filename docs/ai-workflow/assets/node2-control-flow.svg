<svg viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#B4B2A9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <title>节点② 路由分流控制流</title>
  <desc>routeCandidate：纯函数 computeRouting，零 LLM、零重试。读节点①的 analysis，输出 routing（角色 / 深浅权重 / 是否有盲区）</desc>

  <g>
    <rect x="220" y="50" width="240" height="44" rx="8" fill="#2C2C2A" stroke="#1D9E75" stroke-width="0.5"/>
    <text x="340" y="68" text-anchor="middle" fill="#F1EFE8" font-size="14" font-weight="500" dominant-baseline="central">节点② 入口</text>
    <text x="340" y="86" text-anchor="middle" fill="#B4B2A9" font-size="12" dominant-baseline="central">输入 analysis（节点① 画像）</text>
  </g>
  <line x1="340" y1="94" x2="340" y2="128" stroke="#B4B2A9" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="170" y="128" width="340" height="130" rx="8" fill="#2C2C2A" stroke="#1D9E75" stroke-width="0.5"/>
    <text x="340" y="150" text-anchor="middle" fill="#F1EFE8" font-size="13" font-weight="500" dominant-baseline="central">computeRouting（纯函数·零 LLM·零重试）</text>
    <text x="190" y="178" fill="#F1EFE8" font-size="12" dominant-baseline="central">· 算 targetRole：前端 / 全栈（按 level 判是否含后端）</text>
    <text x="190" y="202" fill="#F1EFE8" font-size="12" dominant-baseline="central">· 算 bias 权重：concept / deepDive（归一化）</text>
    <text x="190" y="226" fill="#F1EFE8" font-size="12" dominant-baseline="central">· hasBlindSpots = blindSpots.length &gt; 0</text>
    <text x="190" y="248" fill="#B4B2A9" font-size="11" dominant-baseline="central">同输入同输出、可单测、零 token</text>
  </g>
  <line x1="340" y1="258" x2="340" y2="292" stroke="#B4B2A9" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="200" y="292" width="280" height="56" rx="8" fill="#2C2C2A" stroke="#1D9E75" stroke-width="0.5"/>
    <text x="340" y="312" text-anchor="middle" fill="#F1EFE8" font-size="13" font-weight="500" dominant-baseline="central">输出 routing</text>
    <text x="340" y="330" text-anchor="middle" fill="#B4B2A9" font-size="12" dominant-baseline="central">level / targetRole / bias / hasBlindSpots</text>
    <text x="340" y="344" text-anchor="middle" fill="#B4B2A9" font-size="11" dominant-baseline="central">+ logs → 交节点③</text>
  </g>
</svg>
