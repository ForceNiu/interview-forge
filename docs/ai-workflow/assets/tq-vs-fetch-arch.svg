<svg viewBox="0 0 680 470" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>三层架构：TQ 在浏览器层、prisma 在服务器层，互不相关</title>
  <defs>
    <marker id="arw" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5F5E5A"/>
    </marker>
  </defs>

  <text x="340" y="22" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A">三层架构：哪层用 fetch，哪层用 prisma</text>

  <rect x="24" y="40" width="632" height="150" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/>
  <text x="44" y="64" font-size="13" font-weight="500" fill="#0C447C">浏览器 / 客户端 — 你的 React 代码在这层</text>

  <rect x="52" y="80" width="270" height="92" rx="9" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1.5"/>
  <text x="70" y="104" font-size="13" font-weight="500" fill="#791F1F">裸 fetch</text>
  <text x="70" y="124" font-size="12" fill="#2C2C2A">发一次请求、拿一次结果</text>
  <text x="70" y="142" font-size="12" fill="#2C2C2A">结果自己用 useState 管</text>
  <text x="70" y="160" font-size="12" fill="#2C2C2A">无缓存、跨页不同步</text>

  <rect x="358" y="80" width="270" height="92" rx="9" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1.5"/>
  <text x="376" y="104" font-size="13" font-weight="500" fill="#27500A">TanStack Query</text>
  <text x="376" y="124" font-size="12" fill="#2C2C2A">= fetch + 缓存</text>
  <text x="376" y="142" font-size="12" fill="#2C2C2A">+ 跨页同步 + 写后重拉</text>
  <text x="376" y="160" font-size="12" fill="#2C2C2A">+ 免费 loading / error 状态</text>

  <rect x="24" y="218" width="632" height="84" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/>
  <text x="44" y="244" font-size="13" font-weight="500" fill="#085041">服务器 — API 路由 / Server Action</text>
  <text x="44" y="268" font-size="12" fill="#2C2C2A">接收 HTTP 请求 → 调 prisma 操作数据库</text>

  <rect x="200" y="330" width="280" height="80" rx="12" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.5"/>
  <text x="220" y="358" font-size="13" font-weight="500" fill="#633806">数据库（Postgres）</text>
  <text x="220" y="380" font-size="12" fill="#2C2C2A">prisma 在这一层操作它</text>

  <line x1="187" y1="172" x2="187" y2="216" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arw)"/>
  <line x1="493" y1="172" x2="493" y2="216" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arw)"/>
  <line x1="340" y1="302" x2="340" y2="328" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arw)"/>

  <text x="24" y="446" font-size="11" fill="#A32D2D">前端不能直连 DB：密码在服务端，prisma 在服务器跑</text>
  <text x="358" y="446" font-size="11" fill="#3B6D11">TQ 包着 fetch（本项目 fetchFavorites），不是替代 fetch</text>
</svg>