<svg viewBox="0 0 680 560" width="100%" xmlns="http://www.w3.org/2000/svg">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>
<title>Interview Forge AI 工作流端到端流转</title>
<desc>节点①到⑤因果链：分析简历→路由分流→规划出题策略→生成题目→质量校验；质量不达标则回环到④只重失败域，最多2轮；调用层3次仍败的域永久退出。整条链路必终止。</desc>

<text x="340" y="26" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#E8E8E8">Interview Forge · AI 工作流端到端流转</text>

<!-- ① -->
<rect x="240" y="46" width="200" height="56" rx="8" fill="#3C3489" stroke="#AFA9EC" stroke-width="0.5"/>
<text x="340" y="68" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#EEEDFE">① 分析简历</text>
<text x="340" y="86" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#CECBF6">画像：水平/技术栈/项目</text>

<line x1="340" y1="102" x2="340" y2="130" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- ② -->
<rect x="240" y="130" width="200" height="56" rx="8" fill="#0F6E56" stroke="#5DCAA5" stroke-width="0.5"/>
<text x="340" y="152" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#E1F5EE">② 路由分流</text>
<text x="340" y="170" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#9FE1CB">角色 + 深浅映射</text>

<text x="40" y="150" font-family="sans-serif" font-size="11" fill="#9FE1CB">纯函数路由</text>
<text x="40" y="166" font-family="sans-serif" font-size="11" fill="#9FE1CB">零 token</text>
<line x1="178" y1="156" x2="238" y2="156" stroke="#5DCAA5" stroke-width="1" stroke-dasharray="4 3"/>

<line x1="340" y1="186" x2="340" y2="214" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- ③ -->
<rect x="240" y="214" width="200" height="56" rx="8" fill="#0C447C" stroke="#85B7EB" stroke-width="0.5"/>
<text x="340" y="236" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#E6F1FB">③ 规划出题策略</text>
<text x="340" y="254" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#B5D4F4">每域 depth/题型/题数</text>

<line x1="340" y1="270" x2="340" y2="298" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- ④ -->
<rect x="240" y="298" width="200" height="56" rx="8" fill="#854F0B" stroke="#EF9F27" stroke-width="0.5"/>
<text x="340" y="320" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#FAEEDA">④ 生成题目</text>
<text x="340" y="338" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#FAC775">并行 + 域内重试3次</text>

<text x="40" y="316" font-family="sans-serif" font-size="11" fill="#F7C1C1">调用层3次仍败 →</text>
<text x="40" y="332" font-family="sans-serif" font-size="11" fill="#F7C1C1">调用失败域</text>
<text x="40" y="348" font-family="sans-serif" font-size="11" fill="#F7C1C1">(不重跑·仅汇报)</text>
<line x1="160" y1="332" x2="238" y2="332" stroke="#A32D2D" stroke-width="1" stroke-dasharray="4 3"/>

<line x1="340" y1="354" x2="340" y2="382" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- ⑤ -->
<rect x="240" y="382" width="200" height="56" rx="8" fill="#27500A" stroke="#97C459" stroke-width="0.5"/>
<text x="340" y="404" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#EAF3DE">⑤ 质量校验</text>
<text x="340" y="422" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#C0DD97">硬规则门禁·零 LLM</text>

<!-- 达标直下 END -->
<line x1="340" y1="438" x2="340" y2="466" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="260" y="466" width="160" height="44" rx="8" fill="#2C2C2A" stroke="#888780" stroke-width="0.5"/>
<text x="340" y="492" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="500" fill="#D3D1C7">出题完成（END）</text>
<text x="196" y="460" font-family="sans-serif" font-size="11" fill="#D3D1C7">达标·轮次满</text>

<!-- 回环 ⑤ -> ④ -->
<path d="M440 410 H500 V324 H440" fill="none" stroke="#BA7517" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="508" y="356" font-family="sans-serif" font-size="11" fill="#FAC775">轮次≤2 截断</text>
<text x="508" y="374" font-family="sans-serif" font-size="11" fill="#FAC775">不达标回环④</text>
<text x="508" y="390" font-family="sans-serif" font-size="11" fill="#FAC775">重出队列·只重失败域</text>

</svg>
