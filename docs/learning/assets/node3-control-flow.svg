<svg viewBox="0 0 680 780" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#B4B2A9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <title>节点③ 规划出题策略控制流</title>
  <desc>planStrategy：把节点①画像 + 节点②路由偏重注入 prompt，调 LLM 按三层映射规则产出 strategy；经 Zod + 总量校验（纯函数）后输出；任一失败由手写 for 循环重试（lastErr 回灌，非框架，≤3 次）</desc>

  <g>
    <rect x="200" y="40" width="280" height="44" rx="8" fill="#2C2C2A" stroke="#378ADD" stroke-width="0.5"/>
    <text x="340" y="58" text-anchor="middle" fill="#F1EFE8" font-size="14" font-weight="500" dominant-baseline="central">节点③ 入口</text>
    <text x="340" y="76" text-anchor="middle" fill="#B4B2A9" font-size="12" dominant-baseline="central">输入 analysis（①）+ routing（②）</text>
  </g>
  <line x1="340" y1="84" x2="340" y2="106" stroke="#B4B2A9" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="170" y="106" width="340" height="60" rx="8" fill="#2C2C2A" stroke="#378ADD" stroke-width="0.5"/>
    <text x="340" y="126" text-anchor="middle" fill="#F1EFE8" font-size="13" font-weight="500" dominant-baseline="central">构造画像 + 注入路由偏重</text>
    <text x="340" y="146" text-anchor="middle" fill="#B4B2A9" font-size="12" dominant-baseline="central">categorySummary：按域分组能力（过滤空域）</text>
    <text x="340" y="162" text-anchor="middle" fill="#B4B2A9" font-size="11" dominant-baseline="central">routingHint / depthSummary：确定性偏重·非 LLM 再分类</text>
  </g>
  <line x1="340" y1="166" x2="340" y2="186" stroke="#B4B2A9" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="180" y="186" width="320" height="58" rx="8" fill="#2C2C2A" stroke="#378ADD" stroke-width="0.5"/>
    <text x="340" y="206" text-anchor="middle" fill="#F1EFE8" font-size="13" font-weight="500" dominant-baseline="central">拼 prompt</text>
    <text x="340" y="226" text-anchor="middle" fill="#B4B2A9" font-size="12" dominant-baseline="central">三层映射：deep→project-deep-dive</text>
    <text x="340" y="242" text-anchor="middle" fill="#B4B2A9" font-size="11" dominant-baseline="central">medium→concept / gap→gap-fill；总量 8-10</text>
  </g>
  <line x1="340" y1="244" x2="340" y2="266" stroke="#B4B2A9" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="200" y="266" width="280" height="44" rx="8" fill="#2C2C2A" stroke="#378ADD" stroke-width="0.5"/>
    <text x="340" y="288" text-anchor="middle" fill="#F1EFE8" font-size="13" font-weight="500" dominant-baseline="central">llm.invoke 调 LLM（大语言模型）</text>
  </g>
  <line x1="340" y1="310" x2="340" y2="334" stroke="#B4B2A9" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="200" y="334" width="280" height="44" rx="8" fill="#2C2C2A" stroke="#378ADD" stroke-width="0.5"/>
    <text x="340" y="356" text-anchor="middle" fill="#F1EFE8" font-size="13" font-weight="500" dominant-baseline="central">正则抽取 JSON `{...}`</text>
  </g>
  <line x1="340" y1="378" x2="340" y2="396" stroke="#B4B2A9" stroke-width="1.5" marker-end="url(#arrow)"/>

  <polygon points="340,396 420,436 340,476 260,436" fill="#2C2C2A" stroke="#378ADD" stroke-width="0.5"/>
  <text x="340" y="432" text-anchor="middle" fill="#F1EFE8" font-size="12" font-weight="500" dominant-baseline="central">抽到合法 JSON?</text>
  <text x="200" y="430" fill="#B4B2A9" font-size="11">否</text>
  <text x="430" y="430" fill="#B4B2A9" font-size="11">是</text>
  <line x1="260" y1="436" x2="480" y2="420" stroke="#BA7517" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="340" y1="476" x2="340" y2="500" stroke="#B4B2A9" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="200" y="500" width="280" height="64" rx="8" fill="#2C2C2A" stroke="#378ADD" stroke-width="0.5"/>
    <text x="340" y="520" text-anchor="middle" fill="#F1EFE8" font-size="13" font-weight="500" dominant-baseline="central">Zod 校验 + 总量校验</text>
    <text x="340" y="540" text-anchor="middle" fill="#B4B2A9" font-size="12" dominant-baseline="central">strategySchema.parse</text>
    <text x="340" y="556" text-anchor="middle" fill="#B4B2A9" font-size="11" dominant-baseline="central">validateTotalCount：count 总和 8-10（纯函数）</text>
  </g>
  <line x1="340" y1="564" x2="340" y2="580" stroke="#B4B2A9" stroke-width="1.5" marker-end="url(#arrow)"/>

  <polygon points="340,580 420,620 340,660 260,620" fill="#2C2C2A" stroke="#378ADD" stroke-width="0.5"/>
  <text x="340" y="616" text-anchor="middle" fill="#F1EFE8" font-size="12" font-weight="500" dominant-baseline="central">校验通过?</text>
  <text x="200" y="614" fill="#B4B2A9" font-size="11">否</text>
  <text x="430" y="614" fill="#B4B2A9" font-size="11">是</text>
  <line x1="260" y1="620" x2="480" y2="560" stroke="#BA7517" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="340" y1="660" x2="340" y2="682" stroke="#B4B2A9" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="200" y="682" width="280" height="56" rx="8" fill="#2C2C2A" stroke="#378ADD" stroke-width="0.5"/>
    <text x="340" y="702" text-anchor="middle" fill="#F1EFE8" font-size="13" font-weight="500" dominant-baseline="central">输出 strategy</text>
    <text x="340" y="720" text-anchor="middle" fill="#B4B2A9" font-size="12" dominant-baseline="central">每域 depth / questionType / count</text>
    <text x="340" y="734" text-anchor="middle" fill="#B4B2A9" font-size="11" dominant-baseline="central">+ logs → 交节点④</text>
  </g>

  <g>
    <rect x="480" y="410" width="180" height="150" rx="8" fill="#2C2C2A" stroke="#BA7517" stroke-width="1"/>
    <text x="496" y="432" fill="#FAC775" font-size="13" font-weight="500" dominant-baseline="central">任一环节失败即抛错</text>
    <text x="496" y="456" fill="#F1EFE8" font-size="12" dominant-baseline="central">· JSON 抽不到</text>
    <text x="496" y="476" fill="#F1EFE8" font-size="12" dominant-baseline="central">· Zod 畸形</text>
    <text x="496" y="496" fill="#F1EFE8" font-size="12" dominant-baseline="central">· 总量不达标</text>
    <text x="496" y="518" fill="#FAC775" font-size="12" dominant-baseline="central">→ 手写 for 循环重试（非框架）</text>
    <text x="496" y="534" fill="#FAC775" font-size="12" dominant-baseline="central">重试节点③（≤3 次）</text>
    <text x="496" y="552" fill="#B4B2A9" font-size="11" dominant-baseline="central">（纯函数校验不消耗 LLM）</text>
  </g>
  <line x1="570" y1="410" x2="570" y2="62" stroke="#BA7517" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="570" y1="62" x2="480" y2="62" stroke="#BA7517" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
</svg>
