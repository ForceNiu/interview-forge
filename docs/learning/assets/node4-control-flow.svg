<svg viewBox="0 0 680 784" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>节点④ 生成题目控制流</title>
  <desc>展示 generateQuestions 入口、精炼分支、并行扇出、域内手写重试环、串行合并日志的完整流程</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#B4B2A9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <g>
    <rect x="240" y="40" width="200" height="44" rx="8" fill="#2C2C2A" stroke="#7F77DD" stroke-width="0.5"/>
    <text x="340" y="58" text-anchor="middle" fill="#F1EFE8" font-size="14" font-weight="500" dominant-baseline="central">generateQuestions 入口</text>
    <text x="340" y="76" text-anchor="middle" fill="#B4B2A9" font-size="12" dominant-baseline="central">节点④ 编排函数</text>
  </g>

  <polygon points="340,98 435,140 340,182 245,140" fill="#2C2C2A" stroke="#7F77DD" stroke-width="0.5"/>
  <text x="340" y="140" text-anchor="middle" fill="#F1EFE8" font-size="13" font-weight="500" dominant-baseline="central">refineDomains 非空?</text>

  <g>
    <rect x="40" y="225" width="210" height="64" rx="8" fill="#2C2C2A" stroke="#1D9E75" stroke-width="0.5"/>
    <text x="145" y="247" text-anchor="middle" fill="#F1EFE8" font-size="13" font-weight="500" dominant-baseline="central">首出：处理全部域</text>
    <text x="145" y="267" text-anchor="middle" fill="#B4B2A9" font-size="12" dominant-baseline="central">keptQuestions = 空</text>
    <text x="145" y="283" text-anchor="middle" fill="#B4B2A9" font-size="11" dominant-baseline="central">hint = 空</text>
  </g>

  <g>
    <rect x="430" y="225" width="210" height="64" rx="8" fill="#2C2C2A" stroke="#1D9E75" stroke-width="0.5"/>
    <text x="535" y="247" text-anchor="middle" fill="#F1EFE8" font-size="13" font-weight="500" dominant-baseline="central">重出：只处理失败域</text>
    <text x="535" y="267" text-anchor="middle" fill="#B4B2A9" font-size="12" dominant-baseline="central">keptQuestions=上一轮好题</text>
    <text x="535" y="283" text-anchor="middle" fill="#B4B2A9" font-size="11" dominant-baseline="central">hint=为何不达标</text>
  </g>

  <g>
    <rect x="225" y="320" width="230" height="48" rx="8" fill="#2C2C2A" stroke="#7F77DD" stroke-width="0.5"/>
    <text x="340" y="340" text-anchor="middle" fill="#F1EFE8" font-size="13" font-weight="500" dominant-baseline="central">mapWithConcurrency 限 5 路并发</text>
    <text x="340" y="358" text-anchor="middle" fill="#B4B2A9" font-size="12" dominant-baseline="central">各域独立 generateForDomain</text>
  </g>

  <g>
    <rect x="215" y="400" width="250" height="44" rx="8" fill="#2C2C2A" stroke="#7F77DD" stroke-width="0.5"/>
    <text x="340" y="418" text-anchor="middle" fill="#F1EFE8" font-size="13" font-weight="500" dominant-baseline="central">遍历 domainsToProcess</text>
    <text x="340" y="434" text-anchor="middle" fill="#B4B2A9" font-size="12" dominant-baseline="central">调 generateForDomain</text>
  </g>

  <g>
    <rect x="80" y="470" width="520" height="150" rx="8" fill="#2C2C2A" stroke="#BA7517" stroke-width="1"/>
    <text x="100" y="492" text-anchor="start" fill="#FAC775" font-size="13" font-weight="500" dominant-baseline="central">域内重试环  for attempt = 1..3（手写重试，非框架重试）</text>
    <text x="100" y="516" text-anchor="start" fill="#F1EFE8" font-size="12" dominant-baseline="central">1. llm.invoke(...) + withTimeout(300s 超时即中止)</text>
    <text x="100" y="538" text-anchor="start" fill="#F1EFE8" font-size="12" dominant-baseline="central">2. regex 抽 JSON 数组，缺失则抛错</text>
    <text x="100" y="560" text-anchor="start" fill="#F1EFE8" font-size="12" dominant-baseline="central">3. Zod(generatedQuestionSchema) 校验，畸形即抛错</text>
    <text x="100" y="582" text-anchor="start" fill="#F1EFE8" font-size="12" dominant-baseline="central">4. 成功 → 附 _domain 标记 → break</text>
    <text x="100" y="604" text-anchor="start" fill="#F1EFE8" font-size="12" dominant-baseline="central">5. 失败 attempt&lt;3 续试；3 次均败 → ok=false 进 callFailed</text>
  </g>

  <g>
    <rect x="190" y="650" width="300" height="48" rx="8" fill="#2C2C2A" stroke="#7F77DD" stroke-width="0.5"/>
    <text x="340" y="670" text-anchor="middle" fill="#F1EFE8" font-size="13" font-weight="500" dominant-baseline="central">串行合并 localLogs</text>
    <text x="340" y="688" text-anchor="middle" fill="#B4B2A9" font-size="12" dominant-baseline="central">收集 newQuestions / callFailed</text>
  </g>

  <g>
    <rect x="210" y="720" width="260" height="44" rx="8" fill="#2C2C2A" stroke="#7F77DD" stroke-width="0.5"/>
    <text x="340" y="738" text-anchor="middle" fill="#F1EFE8" font-size="13" font-weight="500" dominant-baseline="central">allQuestions = kept + new</text>
    <text x="340" y="754" text-anchor="middle" fill="#B4B2A9" font-size="12" dominant-baseline="central">→ 交节点⑤ 校验</text>
  </g>

  <line x1="340" y1="84" x2="340" y2="96" stroke="#B4B2A9" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <line x1="262" y1="166" x2="160" y2="223" stroke="#B4B2A9" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <line x1="418" y1="166" x2="520" y2="223" stroke="#B4B2A9" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <line x1="155" y1="289" x2="272" y2="318" stroke="#B4B2A9" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <line x1="525" y1="289" x2="408" y2="318" stroke="#B4B2A9" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <line x1="340" y1="368" x2="340" y2="398" stroke="#B4B2A9" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <line x1="340" y1="444" x2="340" y2="468" stroke="#B4B2A9" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <line x1="340" y1="620" x2="340" y2="648" stroke="#B4B2A9" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <line x1="340" y1="698" x2="340" y2="718" stroke="#B4B2A9" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="195" y="188" fill="#B4B2A9" font-size="11">否</text>
  <text x="490" y="188" fill="#B4B2A9" font-size="11">是</text>
</svg>
